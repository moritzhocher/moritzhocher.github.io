  <style>
    /* Project Grid Styles */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5vw;
    }

    .project-card {
      background: #23262b;
      border: 2px solid #181a1b;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      border-color: #ff7a1a;
    }

    .project-image-container {
      height: 300px;
      background: #181a1b;
      position: relative;
      overflow: hidden;
    }

    .project-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .project-media.active {
      display: block;
    }

    .project-media:not(.active) {
      display: none;
    }

    /* YouTube embed specific styles */
    .project-media[src*="youtube.com"] {
      object-fit: contain;
      background: #000;
      border-radius: 0;
    }

    /* Fullscreen Modal Styles */
    .fullscreen-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .fullscreen-modal.active {
      display: flex;
    }

    .fullscreen-content {
      max-width: 90vw;
      max-height: 90vh;
      position: relative;
      cursor: default;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .fullscreen-image {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .fullscreen-video {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .fullscreen-iframe {
      max-width: 90vw;
      max-height: 90vh;
      width: 90vw;
      height: 90vh;
      border-radius: 8px;
      cursor: pointer;
      display: block;
    }

    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 122, 26, 0.9);
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .modal-nav:hover {
      background: rgba(255, 122, 26, 1);
    }

    .modal-prev {
      left: -50px;
    }

    .modal-prev::before {
      content: '';
      width: 40px;
      height: 40px;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='18' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M23 13 L17 20 L23 27' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .modal-next {
      right: -50px;
    }

    .modal-next::before {
      content: '';
      width: 40px;
      height: 40px;
      background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='18' stroke='white' stroke-width='2' fill='none'/%3E%3Cpath d='M17 13 L23 20 L17 27' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .modal-dots {
      position: absolute;
      bottom: -25px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
    }

    .modal-dot {
      width: 10px;
      height: 10px;

      background: rgba(255, 255, 255, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .modal-dot.active {

      border-color: #ff7a1a;
    }

    /* Mobile Modal Styles */

      }

      .fullscreen-image {

        max-height: 90vh;
      }

    // Generate project cards
    function generateProjectCards() {
      const grid = document.getElementById('projectsGrid');
      let cardIndex = 0;

      Object.keys(projectData).forEach(category => {
        Object.keys(projectData[category]).forEach(project => {
          const projectInfo = projectData[category][project];
          const card = createProjectCard(category, project, projectInfo, cardIndex);
          grid.appendChild(card);
          cardIndex++;
        });
      });
    }

    // Create individual project card
    function createProjectCard(category, projectName, projectInfo, cardIndex) {
      const card = document.createElement('div');
      card.className = 'project-card';
      
      const hasMultipleFiles = projectInfo.files.length > 1;
      
      card.innerHTML = `
        <div class="project-image-container">
          ${projectInfo.files.map((file, index) => {
            const isVideo = file.endsWith('.mp4') || file.endsWith('.mkv');
            const isYouTube = file.startsWith('youtube:');
            const mediaPath = `Media/personal_projects/${category}/${projectName}/${file}`;
            
            if (isYouTube) {
              const videoId = file.split(':')[1];
              return `<iframe src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1" class="project-media ${index === 0 ? 'active' : ''}" frameborder="0" allowfullscreen onclick="openFullscreenModal('${category}', '${projectName}', ${cardIndex}, ${index})"></iframe>`;
            } else if (isVideo) {
              return `<video src="${mediaPath}" class="project-media ${index === 0 ? 'active' : ''}" controls muted playsinline onclick="openFullscreenModal('${category}', '${projectName}', ${cardIndex}, ${index})"></video>`;
            } else {
              return `<img src="${mediaPath}" class="project-media ${index === 0 ? 'active' : ''}" alt="${projectName}" onclick="openFullscreenModal('${category}', '${projectName}', ${cardIndex}, ${index})">`;
            }
          }).join('')}
          
          ${hasMultipleFiles ? `
            <button class="gallery-nav gallery-prev" onclick="changeGalleryImage(-1, ${cardIndex})"></button>
            <button class="gallery-nav gallery-next" onclick="changeGalleryImage(1, ${cardIndex})"></button>
            <div class="gallery-dots">
              ${projectInfo.files.map((_, index) => 
                `<span class="dot ${index === 0 ? 'active' : ''}" onclick="goToGalleryImage(${index}, ${cardIndex})"></span>`
              ).join('')}
            </div>
          ` : ''}
        </div>
        <div class="project-tags">
          ${projectInfo.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
        </div>
      `;
      
      return card;
    }

    // Gallery navigation functions
    function changeGalleryImage(direction, cardIndex) {
      const card = document.querySelectorAll('.project-card')[cardIndex];
      const images = card.querySelectorAll('.project-media');
      const dots = card.querySelectorAll('.dot');
      const currentIndex = Array.from(images).findIndex(img => img.classList.contains('active'));
      
      let newIndex = currentIndex + direction;
      
      if (newIndex >= images.length) {
        newIndex = 0;
      } else if (newIndex < 0) {
        newIndex = images.length - 1;
      }
      
      // Hide current image and dot
      images[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      
      // Show new image and dot
      images[newIndex].classList.add('active');
      dots[newIndex].classList.add('active');
    }

    function goToGalleryImage(index, cardIndex) {
      const card = document.querySelectorAll('.project-card')[cardIndex];
      const images = card.querySelectorAll('.project-media');
      const dots = card.querySelectorAll('.dot');
      
      // Hide all images and dots
      images.forEach((img, i) => {
        img.classList.remove('active');
        dots[i].classList.remove('active');
      });
      
      // Show selected image and dot
      images[index].classList.add('active');
      dots[index].classList.add('active');
    }

    // Fullscreen Modal Variables
    let currentModalData = null;
    let currentModalIndex = 0;

    // Open fullscreen modal
    function openFullscreenModal(category, projectName, cardIndex, mediaIndex) {
      const projectInfo = projectData[category][projectName];
      currentModalData = { category, projectName, projectInfo, cardIndex };
      currentModalIndex = mediaIndex;
      
      const modal = document.getElementById('fullscreenModal');
      const modalMedia = document.getElementById('modalMedia');
      const modalDots = document.getElementById('modalDots');
      
      // Create modal content
      const file = projectInfo.files[mediaIndex];
      const isVideo = file.endsWith('.mp4') || file.endsWith('.mkv');
      const isYouTube = file.startsWith('youtube:');
      const mediaPath = `Media/personal_projects/${category}/${projectName}/${file}`;
      
      if (isYouTube) {
        const videoId = file.split(':')[1];
        modalMedia.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&autoplay=1" class="fullscreen-iframe" frameborder="0" allowfullscreen></iframe>`;
      } else if (isVideo) {
        modalMedia.innerHTML = `<video src="${mediaPath}" class="fullscreen-video" controls autoplay></video>`;
      } else {
        modalMedia.innerHTML = `<img src="${mediaPath}" class="fullscreen-image" alt="${projectName}">`;
      }
      
      // Create dots if multiple files
      if (projectInfo.files.length > 1) {
        modalDots.innerHTML = projectInfo.files.map((_, index) => 
          `<span class="modal-dot ${index === mediaIndex ? 'active' : ''}" onclick="goToModalImage(${index})"></span>`
        ).join('');
        modalDots.style.display = 'flex';
      } else {
        modalDots.style.display = 'none';
      }
      
      // Show/hide navigation buttons
      const prevBtn = document.querySelector('.modal-prev');
      const nextBtn = document.querySelector('.modal-next');
      
      if (projectInfo.files.length > 1) {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
      } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      }
      
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // Close fullscreen modal
    function closeFullscreenModal() {
      const modal = document.getElementById('fullscreenModal');
      modal.classList.remove('active');
      document.body.style.overflow = 'auto';
      currentModalData = null;
      currentModalIndex = 0;
    }

    // Change modal image
    function changeModalImage(direction) {
      if (!currentModalData) return;
      
      const { projectInfo } = currentModalData;
      let newIndex = currentModalIndex + direction;
      
      if (newIndex >= projectInfo.files.length) {
        newIndex = 0;
      } else if (newIndex < 0) {
        newIndex = projectInfo.files.length - 1;
      }
      
      goToModalImage(newIndex);
    }

    // Go to specific modal image
    function goToModalImage(index) {
      if (!currentModalData) return;
      
      const { category, projectName, projectInfo } = currentModalData;
      currentModalIndex = index;
      
      const modalMedia = document.getElementById('modalMedia');
      const modalDots = document.querySelectorAll('.modal-dot');
      
      // Update media
      const file = projectInfo.files[index];
      const isVideo = file.endsWith('.mp4') || file.endsWith('.mkv');
      const isYouTube = file.startsWith('youtube:');
      const mediaPath = `Media/personal_projects/${category}/${projectName}/${file}`;
      
      if (isYouTube) {
        const videoId = file.split(':')[1];
        modalMedia.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&autoplay=1" class="fullscreen-iframe" frameborder="0" allowfullscreen></iframe>`;
      } else if (isVideo) {
        modalMedia.innerHTML = `<video src="${mediaPath}" class="fullscreen-video" controls autoplay></video>`;
      } else {
        modalMedia.innerHTML = `<img src="${mediaPath}" class="fullscreen-image" alt="${projectName}">`;
      }
      
      // Update dots
      modalDots.forEach((dot, i) => {
        dot.classList.toggle('active', i === index);
      });
    }

    // Close modal when clicking outside content
    document.addEventListener('DOMContentLoaded', function() {
      const modal = document.getElementById('fullscreenModal');
      modal.addEventListener('click', function(e) {
        // Don't close if clicking on navigation buttons or dots
        if (e.target.classList.contains('modal-nav') || e.target.classList.contains('modal-dot')) {
          return;
        }
        
        // Close if clicking on the modal background, content area, or media content
        if (e.target === modal || e.target.classList.contains('fullscreen-content') || 
            e.target.classList.contains('fullscreen-image') || e.target.classList.contains('fullscreen-video') || 
            e.target.classList.contains('fullscreen-iframe')) {
          closeFullscreenModal();
        }
      });
      
      // Close modal with Escape key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
          closeFullscreenModal();
        }
      });
    });

    // Initialize when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Mobile menu functionality
      var mobileMenuToggle = document.getElementById('mobileMenuToggle');
      var mobileLinks = document.getElementById('mobileLinks');
      var mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
      
      if (mobileMenuToggle && mobileLinks) {
        mobileMenuToggle.addEventListener('click', function(e) {
          e.preventDefault();
          if (mobileLinks.style.display === 'block') {
            mobileLinks.style.display = 'none';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.remove('active');
          } else {
            mobileLinks.style.display = 'block';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.add('active');
          }
        });
        
        Array.from(mobileLinks.querySelectorAll('a')).forEach(function(link) {
          link.addEventListener('click', function() {
            mobileLinks.style.display = 'none';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.remove('active');
          });
        });
        
        if (mobileMenuOverlay) {
          mobileMenuOverlay.addEventListener('click', function() {
            mobileLinks.style.display = 'none';
            mobileMenuOverlay.classList.remove('active');
          });
        }
      }

      // Generate project cards
      generateProjectCards();
    });
  </script>
</body>
</html>
