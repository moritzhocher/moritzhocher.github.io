  <style>
    .traditional-gallery-masonry {
      column-count: 4;
      column-gap: 18px;
      margin: 48px 5vw 48px 5vw;
    }
    .gallery-card {
      background: #23262b;
      border-radius: 12px;
      width: 100%;
      min-height: 200px;
      box-shadow: 0 2px 12px 0 rgba(0,0,0,0.10);
      display: block;
      margin-bottom: 18px;
      font-family: 'JetBrains Mono', 'Share Tech Mono', monospace;
      font-size: 1.1rem;
      color: #fff;
      font-style: italic;
      break-inside: avoid;
      cursor: pointer;
      position: relative;
      z-index: 1;
      transition: box-shadow 0.22s cubic-bezier(.4,0,.2,1), transform 0.22s cubic-bezier(.4,0,.2,1);
    }
    .gallery-card:hover:not(.fullscreen) {
      box-shadow: 0 8px 32px 0 rgba(0,0,0,0.18);
      z-index: 2;
      transform: scale(1.035);
    }
    .gallery-card.fullscreen {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      width: 70vw !important;
      height: 80vh !important;
      max-width: 900px !important;
      max-height: 90vh !important;
      min-width: 320px !important;
      min-height: 200px !important;
      box-shadow: 0 12px 48px 0 rgba(0,0,0,0.32);
      z-index: 1002 !important;
      margin: 0 !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: none !important;
      background: transparent !important;
    }
    .gallery-card.fullscreen img {
      width: auto !important;
      height: auto !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      object-fit: contain !important;
    }
    .gallery-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100vw; height: 100vh;
      background: rgba(16,16,20,0.82);
      z-index: 1001;
      opacity: 1;
      pointer-events: auto;
      transition: none !important;
    }
    .gallery-card.hide-card {
      opacity: 0 !important;
      pointer-events: none !important;
      transition: none !important;
    }
    .gallery-card.dragging {
      opacity: 0.5;
      border: 2px dashed #ff7a1a;
      z-index: 10;
    }
    .gallery-card.drag-over {
      outline: 3px solid #ff7a1a;
      outline-offset: -3px;
    }
    /* Hamburger styles */
    .menu-toggle {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: none;
      position: relative;
      width: 40px;
      height: 40px;
      z-index: 200;
      margin-left: 8px;
    }
    .hamburger {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 28px;
      height: 22px;
      position: relative;
      gap: 5px;
    }
    .hamburger span {
      display: block;
      width: 28px;
      height: 3px;
      background: #bfc3c9;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .desktop-menu {

      gap: 1.1em;
      align-items: center;
    }
    .mobile-menu {

      position: relative;
      align-items: center;
      z-index: 301;
    }
    .mobile-menu .icon {
      background: none;
      border: none;
      outline: none;
      cursor: pointer;
      display: block;
      position: relative;
      right: 0;
      top: 0;
      padding: 4px 6px;
      z-index: 302;
    }
    .mobile-menu #mobileLinks {
      background: #101014;
      border-radius: 12px;
      box-shadow: 0 4px 24px 0 rgba(0,0,0,0.22);
      border: 1.5px solid #181a1b;
      position: absolute;
      top: 36px;
      left: 0;
      right: auto;
      width: 45vw;
      min-width: 0;
      max-width: none;
      padding: 6px 0;
      z-index: 303;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
    }
    .mobile-menu #mobileLinks a {
      display: block;
      width: 100%;
      padding: 8px 10px;
      text-align: left;
      border-radius: 0;
      border: none;
      background: none;
      font-size: 0.92rem;
      color: #bfc3c9;

    .mobile-menu #mobileLinks a:hover, .mobile-menu #mobileLinks a:focus, .mobile-menu #mobileLinks a.active {
      background: #ff7a1a;
      color: #fff;
    }
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(16,16,20,0.85);
      z-index: 199;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s;
    }
    .mobile-menu-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    @media (max-width: 900px) {
      .traditional-gallery-masonry {
        column-count: 3;
      }
      .gallery-card.fullscreen {
        width: 92vw !important;
        height: 70vh !important;
        min-width: 0 !important;
        min-height: 0 !important;
        max-height: 60vh !important;

      .gallery-card {
        max-height: 195px;
        min-height: 60px;
      }
      .desktop-menu {
        display: none !important;
      }
      .mobile-menu {
        display: flex !important;
        align-items: center;
        order: 1;
      }
      .logo {
        order: 2;
        margin-left: 12px;
      }
    }

  <script>
    // Instant fullscreen effect for gallery cards (no transitions)
    document.addEventListener('DOMContentLoaded', function() {
      const gallery = document.getElementById('traditionalGallery');
      const cards = Array.from(gallery.querySelectorAll('.gallery-card'));
      let overlay = null;
      let fullscreenClone = null;
      let fullscreenCard = null;

      function closeFullscreen() {
        if (!fullscreenClone || !fullscreenCard) return;
        if (overlay) {
          overlay.remove();
          overlay = null;
        }
        if (fullscreenClone) {
          fullscreenClone.remove();
          fullscreenClone = null;
        }
        cards.forEach(card => card.classList.remove('hide-card'));
        fullscreenCard.style.opacity = '';
        fullscreenCard = null;
      }

      cards.forEach(card => {
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          if (fullscreenCard === card) return;
          fullscreenCard = card;
          // Hide all other cards
          cards.forEach(c => { if (c !== card) c.classList.add('hide-card'); });
          // Create overlay
          overlay = document.createElement('div');
          overlay.className = 'gallery-overlay';
          overlay.onclick = closeFullscreen;
          document.body.appendChild(overlay);
          // Clone the card
          fullscreenClone = card.cloneNode(true);
          fullscreenClone.classList.add('fullscreen');
          fullscreenClone.style.position = 'fixed';
          fullscreenClone.style.top = '50%';
          fullscreenClone.style.left = '50%';
          fullscreenClone.style.width = '70vw';
          fullscreenClone.style.height = '80vh';
          fullscreenClone.style.maxWidth = '900px';
          fullscreenClone.style.maxHeight = '90vh';
          fullscreenClone.style.minWidth = '320px';
          fullscreenClone.style.minHeight = '200px';
          fullscreenClone.style.transform = 'translate(-50%, -50%)';
          fullscreenClone.style.margin = '0';
          fullscreenClone.style.zIndex = 1002;
          fullscreenClone.style.boxShadow = '0 12px 48px 0 rgba(0,0,0,0.32)';
          fullscreenClone.style.borderRadius = '12px';
          fullscreenClone.style.transition = 'none';
          // Ensure the image keeps its aspect ratio
          const img = fullscreenClone.querySelector('img');
          if (img) {
            img.style.width = 'auto';
            img.style.height = 'auto';
            img.style.maxWidth = '100%';
            img.style.maxHeight = '100%';
            img.style.display = 'block';
            img.style.margin = '0 auto';
            img.style.borderRadius = '12px';
            img.style.objectFit = 'contain';
          }
          document.body.appendChild(fullscreenClone);
          // Hide original card (opacity, not visibility)
          card.style.opacity = '0';
          // Close on click
          fullscreenClone.onclick = closeFullscreen;
          // Close on escape
          document.addEventListener('keydown', function escHandler(e) {
            if (e.key === 'Escape') {
              closeFullscreen();
              document.removeEventListener('keydown', escHandler);
            }
          });
        });
      });
    });

    // Simple mobile menu toggle
    document.addEventListener('DOMContentLoaded', function() {
      var mobileMenuToggle = document.getElementById('mobileMenuToggle');
      var mobileLinks = document.getElementById('mobileLinks');
      var mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
      if (mobileMenuToggle && mobileLinks) {
        mobileMenuToggle.addEventListener('click', function(e) {
          e.preventDefault();
          if (mobileLinks.style.display === 'block') {
            mobileLinks.style.display = 'none';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.remove('active');
          } else {
            mobileLinks.style.display = 'block';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.add('active');
          }
        });
        // Optional: close menu on link click
        Array.from(mobileLinks.querySelectorAll('a')).forEach(function(link) {
          link.addEventListener('click', function() {
            mobileLinks.style.display = 'none';
            if (mobileMenuOverlay) mobileMenuOverlay.classList.remove('active');
          });
        });
        // Close menu if overlay is clicked
        if (mobileMenuOverlay) {
          mobileMenuOverlay.addEventListener('click', function() {
            mobileLinks.style.display = 'none';
            mobileMenuOverlay.classList.remove('active');
          });
        }
      }
    });
  </script>
